name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests (app-api + speech-api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app-api/requirements.txt

      # speech-api tests mock WhisperX/torch, so only the light deps are installed.
      - name: Install dependencies
        run: |
          pip install -r app-api/requirements.txt
          pip install pytest-asyncio httpx fastapi python-multipart

      - name: app-api unit tests
        working-directory: app-api
        run: python -m pytest tests/ -m unit

      - name: app-api integration tests
        working-directory: app-api
        run: python -m pytest tests/ -m integration

      - name: speech-api tests
        working-directory: speech-api
        run: python -m pytest

  web:
    name: Web (typecheck, lint, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Non-blocking until the 29 existing ESLint errors are fixed; remove continue-on-error then.
      - run: pnpm lint
        continue-on-error: true
      - run: pnpm test:unit:web

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app-api/requirements.txt

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: |
          pip install -r app-api/requirements.txt
          pip install fastapi "uvicorn[standard]" python-multipart
          pnpm install --frozen-lockfile
          pnpm --filter web exec playwright install --with-deps chromium

      # The UI only enables upload when app-api's /health reports the speech-api as reachable.
      # speech-api's /health works without WhisperX (imported only when processing audio),
      # and the specs intercept /upload and /status, so no transcription runs.
      - name: Start speech-api, app-api and Vite
        run: |
          mkdir -p shared
          (cd speech-api && python -m uvicorn main:app --port 8000 > ../speech.log 2>&1 &)
          (cd app-api && SPEECH_API_BASE_URL=http://localhost:8000 python app.py > ../flask.log 2>&1 &)
          (pnpm --filter web dev > vite.log 2>&1 &)
          for url in http://localhost:8000/health http://localhost:5001/health http://localhost:5173; do
            for i in $(seq 1 60); do curl -sf "$url" > /dev/null && break; sleep 1; done
            curl -sf "$url" > /dev/null || { echo "Timed out waiting for $url"; cat speech.log flask.log vite.log; exit 1; }
          done

      - name: Run Playwright
        run: pnpm test:e2e

      - name: Upload Playwright report and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            app-api/web/test-results/
            app-api/web/playwright-report/
            speech.log
            flask.log
            vite.log
          retention-days: 7
